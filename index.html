<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0620">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta property="og:title" content="Orb Duell">
<meta property="og:description" content="Neon-Duell fürs Handy. Antippen und gegen mich antreten!">
<title>Orb Duell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rubik:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0B0620;
    --ink: #EDE8FF;
    --muted: #A89FCC;
    --panel: rgba(20, 12, 48, 0.78);
    --line: rgba(160, 140, 255, 0.22);
    --p1: #57E1FF;
    --p2: #FF6FB1;
    --gold: #FFD66B;
    --mine: #FF4A3D;
    --disp: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
    --body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; -webkit-tap-highlight-color: transparent; }
  #invite { display: flex; flex-direction: column; gap: 8px; }
  .ghost { font: 700 15px var(--disp); letter-spacing: .12em; text-transform: uppercase; color: var(--p1); background: rgba(87, 225, 255, .08); border: 1px solid var(--p1); border-radius: 10px; padding: 12px; cursor: pointer; }
  .ghost:active { transform: scale(.98); }
  .link { font: 12px ui-monospace, Menlo, Consolas, monospace; color: var(--muted); word-break: break-all; user-select: text; -webkit-user-select: text; text-align: center; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); }
  body { font-family: var(--body); touch-action: none; user-select: none; -webkit-user-select: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #hud {
    position: fixed; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
    pointer-events: none; z-index: 2;
  }
  .chip { display: flex; align-items: center; gap: 8px; min-width: 0; font-family: var(--disp); }
  .chip.right { justify-content: flex-end; text-align: right; }
  .chip .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 10px currentColor; background: currentColor; }
  .chip .meta { display: flex; flex-direction: column; min-width: 0; line-height: 1.05; }
  .chip .name { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30vw; }
  .chip .score { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .chip.a { color: var(--p1); }
  .chip.b { color: var(--p2); }
  .chip .you { font-size: 9px; letter-spacing: .14em; padding: 1px 5px; border: 1px solid currentColor; border-radius: 3px; margin-left: 4px; vertical-align: 2px; }
  #timer { font-family: var(--disp); font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums; padding: 4px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  #timer.hot { color: var(--mine); border-color: rgba(255, 74, 61, .6); animation: pulse .5s ease-in-out infinite alternate; }
  @keyframes pulse { to { transform: scale(1.08); } }

  #overlay {
    position: fixed; inset: 0; z-index: 3; display: grid; place-items: center;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
    background: radial-gradient(ellipse at 50% 40%, rgba(11, 6, 32, .35), rgba(11, 6, 32, .82));
  }
  .card {
    width: min(100%, 380px); display: flex; flex-direction: column; gap: 16px;
    padding: 24px 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .logo { font-family: var(--disp); font-weight: 700; font-size: clamp(44px, 14vw, 60px); line-height: .9; letter-spacing: .02em; text-wrap: balance; margin: 0; }
  .logo span:first-child { color: var(--p1); text-shadow: 0 0 24px rgba(87, 225, 255, .55); }
  .logo span:last-child { color: var(--p2); text-shadow: 0 0 24px rgba(255, 111, 177, .55); }
  .kicker { font-family: var(--disp); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  #result { font-family: var(--disp); font-size: 22px; font-weight: 700; margin: 0; }
  #finals { font-family: var(--disp); font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #status { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.45; padding: 10px 12px; border-radius: 10px; background: rgba(255, 255, 255, .04); border: 1px solid var(--line); }
  #status .led { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--muted); }
  #status.on .led { background: #6BFFB0; box-shadow: 0 0 10px #6BFFB0; }
  #status.wait .led { background: var(--gold); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-family: var(--disp); }
  input {
    font: 500 16px var(--body); color: var(--ink); background: rgba(0, 0, 0, .3);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; letter-spacing: 0; text-transform: none;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--p1); outline-offset: 2px; }
  #go {
    font: 700 18px var(--disp); letter-spacing: .12em; text-transform: uppercase; color: #0B0620;
    padding: 14px; border: 0; border-radius: 10px; cursor: pointer;
    background: linear-gradient(90deg, var(--p1), var(--p2));
    box-shadow: 0 0 28px rgba(255, 111, 177, .35);
  }
  #go:active { transform: scale(.98); }
  #go:disabled { opacity: .45; cursor: default; }
  .rules { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 13px; color: var(--muted); line-height: 1.35; margin: 0; }
  .rules dt { font-family: var(--disp); font-weight: 700; color: var(--ink); }
  .rules .o { color: var(--p1); } .rules .g { color: var(--gold); } .rules .m { color: var(--mine); }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.45; margin: 0; }
  @media (prefers-reduced-motion: reduce) { #timer.hot, #status.wait .led { animation: none; } }
</style>
</head>
<body>

<canvas id="c" aria-label="Spielfeld"></canvas>

<div id="hud">
  <div class="chip a"><span class="dot"></span><div class="meta"><span class="name" id="n0">Spieler 1</span><span class="score" id="s0">0</span></div></div>
  <div id="timer">60</div>
  <div class="chip b right"><div class="meta"><span class="name" id="n1">Bot</span><span class="score" id="s1">0</span></div><span class="dot"></span></div>
</div>

<div id="overlay">
  <div class="card">
    <div>
      <div class="kicker" id="kicker">Echtzeit-Duell für zwei Handys</div>
      <h1 class="logo"><span>ORB</span><br><span>DUELL</span></h1>
    </div>
    <div id="endbox" hidden>
      <p id="result">Du gewinnst!</p>
      <div id="finals">12 : 9</div>
    </div>
    <div id="status" class="wait"><span class="led"></span><span id="statustext">Verbinde…</span></div>
    <label for="nick">Dein Name
      <input id="nick" maxlength="14" autocomplete="off" placeholder="z. B. Thorben">
    </label>
    <button id="go" type="button">Runde starten</button>
    <dl class="rules">
      <dt>Steuern</dt><dd>Finger aufs Feld, dein Schiff fliegt hinterher.</dd>
      <dt class="o">Orb</dt><dd>+1 Punkt</dd>
      <dt class="g">Gold</dt><dd>+5 Punkte</dd>
      <dt class="m">Mine</dt><dd>−3 Punkte und kurz gelähmt</dd>
    </dl>
    <div id="invite" hidden>
      <button id="share" type="button" class="ghost">Kumpel einladen</button>
      <div class="link" id="link"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
  "use strict";
  const W = 900, H = 1500, ROUND = 60000, SHIP_R = 34, ORB_R = 28, MINE_R = 30;
  const COL = ["#57E1FF", "#FF6FB1"], GOLD = "#FFD66B", MINE = "#FF4A3D", WHITE = "#F4F0FF";
  const SPAWN = [[450, 1200], [450, 300]];
  const FAM = "'Chakra Petch', 'Trebuchet MS', sans-serif";
  const $ = (id) => document.getElementById(id);
  const cv = $("c"), ctx = cv.getContext("2d");
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const num = (v, d, a, b) => (typeof v === "number" && isFinite(v)) ? clamp(v, a, b) : d;

  // ---------- sprites ----------
  function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
  function glow(hex, r = 64) {
    const c = document.createElement("canvas"); c.width = c.height = r * 2;
    const g = c.getContext("2d"), gr = g.createRadialGradient(r, r, 0, r, r, r);
    gr.addColorStop(0, rgba(hex, 1)); gr.addColorStop(.18, rgba(hex, .6)); gr.addColorStop(.45, rgba(hex, .16)); gr.addColorStop(1, rgba(hex, 0));
    g.fillStyle = gr; g.fillRect(0, 0, r * 2, r * 2); return c;
  }
  const SPR = { p0: glow(COL[0]), p1: glow(COL[1]), gold: glow(GOLD), mine: glow(MINE), white: glow(WHITE), violet: glow("#8B6BFF") };
  const pspr = (i) => i === 0 ? SPR.p0 : SPR.p1;
  function spr(s, x, y, r, a = 1) { ctx.globalAlpha = a; ctx.drawImage(s, x - r, y - r, r * 2, r * 2); }

  // ---------- canvas sizing ----------
  let dpr = 1, vw = 0, vh = 0, sc = 1, ox = 0, oy = 0, nebula = null;
  const stars = Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random(), z: .2 + Math.random() * .8, t: Math.random() * 6 }));
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    vw = innerWidth; vh = innerHeight;
    cv.width = vw * dpr; cv.height = vh * dpr;
    const top = $("hud").getBoundingClientRect().bottom + 8, bottom = 10;
    sc = Math.min((vw - 16) / W, (vh - top - bottom) / H);
    ox = (vw - W * sc) / 2; oy = top + ((vh - top - bottom) - H * sc) / 2;
    nebula = document.createElement("canvas"); nebula.width = Math.max(1, vw / 2); nebula.height = Math.max(1, vh / 2);
    const g = nebula.getContext("2d"), nw = nebula.width, nh = nebula.height;
    const bg = g.createLinearGradient(0, 0, 0, nh); bg.addColorStop(0, "#120a33"); bg.addColorStop(1, "#070414");
    g.fillStyle = bg; g.fillRect(0, 0, nw, nh);
    [[.2, .25, "#3A1D6E", .55], [.85, .6, "#0E4D6B", .45], [.4, .9, "#5B1850", .35], [.7, .1, "#1d2a7a", .35]].forEach(([x, y, c, a]) => {
      const r = Math.max(nw, nh) * .6, gr = g.createRadialGradient(x * nw, y * nh, 0, x * nw, y * nh, r);
      gr.addColorStop(0, rgba(c, a)); gr.addColorStop(1, rgba(c, 0)); g.fillStyle = gr; g.fillRect(0, 0, nw, nh);
    });
  }
  addEventListener("resize", resize);

  // ---------- audio ----------
  let ac = null;
  function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } if (ac && ac.state === "suspended") ac.resume(); }
  function tone(f, d, type = "sine", v = .12, slide = 0, delay = 0) {
    if (!ac) return; const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + .02);
  }
  const sfx = {
    orb: () => tone(660, .12, "triangle", .12, 1.8),
    far: () => tone(330, .08, "triangle", .05, 1.4),
    gold: () => { tone(784, .1, "square", .06); tone(988, .1, "square", .06, 0, .08); tone(1318, .22, "square", .06, 0, .16); },
    hit: () => { tone(160, .35, "sawtooth", .16, .35); tone(90, .4, "square", .08, .5); },
    beep: () => tone(520, .12, "square", .07),
    los: () => tone(1040, .35, "square", .08, 1.3),
    end: () => { tone(523, .15, "triangle", .12); tone(659, .15, "triangle", .12, 0, .14); tone(784, .4, "triangle", .12, 0, .28); },
  };
  function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { } }

  // ---------- state ----------
  const S = { ph: "lobby", tl: ROUND, cd: 0, s: [0, 0], o: [], m: [], st: [0, 0], pl: [[...SPAWN[0], -157], [...SPAWN[1], 157]], rn: 0, p2: "bot", n: ["Spieler 1", "Bot"] };
  let isHost = true, mySlot = 0, hostPeer = null;
  let orbId = 1, goCount = 0, lastGo = -1, lastP2 = null;
  const me = { x: SPAWN[0][0], y: SPAWN[0][1], vx: 0, vy: 0, a: -Math.PI / 2, tx: SPAWN[0][0], ty: SPAWN[0][1] };
  const bot = { x: SPAWN[1][0], y: SPAWN[1][1], vx: 0, vy: 0, a: Math.PI / 2, tx: SPAWN[1][0], ty: SPAWN[1][1], think: 0 };
  const disp = [{ x: SPAWN[0][0], y: SPAWN[0][1], a: 0 }, { x: SPAWN[1][0], y: SPAWN[1][1], a: 0 }];
  const trails = [[], []];
  let dispM = [];
  const born = new Map();
  let parts = [], texts = [], rings = [], shake = 0, flash = 0, losT = 0, now = 0;

  let myName = "";
  try { myName = localStorage.getItem("orbduell.name") || ""; } catch (e) { }
  $("nick").value = myName;
  const cleanName = (v, d) => (typeof v === "string" ? v.replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u2028-\u202e\u2060-\u206f]/g, "").trim().slice(0, 14) : "") || d;
  $("nick").addEventListener("input", () => { myName = cleanName($("nick").value, ""); try { localStorage.setItem("orbduell.name", myName); } catch (e) { } });

  // ---------- ship physics ----------
  function moveShip(s, tx, ty, dt, f) {
    let dx = tx - s.x, dy = ty - s.y, vx = dx * 7, vy = dy * 7;
    const max = 1150 * f, sp = Math.hypot(vx, vy); if (sp > max) { vx *= max / sp; vy *= max / sp; }
    const k = 1 - Math.exp(-dt * 9); s.vx += (vx - s.vx) * k; s.vy += (vy - s.vy) * k;
    s.x = clamp(s.x + s.vx * dt, 40, W - 40); s.y = clamp(s.y + s.vy * dt, 40, H - 40);
    if (Math.hypot(s.vx, s.vy) > 40) s.a = Math.atan2(s.vy, s.vx);
  }
  function resetShip(s, i) { s.x = s.tx = SPAWN[i][0]; s.y = s.ty = SPAWN[i][1]; s.vx = s.vy = 0; s.a = i ? Math.PI / 2 : -Math.PI / 2; }

  // ---------- host simulation ----------
  function makeMine() {
    const ang = Math.random() * Math.PI * 2, v = 170 + Math.random() * 90;
    return { x: 120 + Math.random() * (W - 240), y: 560 + Math.random() * 380, vx: Math.cos(ang) * v, vy: Math.sin(ang) * v };
  }
  function spawnOrb() {
    for (let tries = 0; tries < 20; tries++) {
      const x = 70 + Math.random() * (W - 140), y = 90 + Math.random() * (H - 180);
      if (S.pl.some(p => Math.hypot(p[0] - x, p[1] - y) < 170)) continue;
      if (S.o.some(o => Math.hypot(o.x - x, o.y - y) < 110)) continue;
      S.o.push({ id: orbId++, x, y, k: Math.random() < .12 ? 1 : 0 }); return;
    }
  }
  function startRound() {
    S.ph = "cd"; S.cd = 3000; S.tl = ROUND; S.s = [0, 0]; S.st = [0, 0]; S.o = []; S.rn++;
    S.m = [makeMine(), makeMine(), makeMine()];
    resetShip(me, 0); resetShip(bot, 1);
    for (let i = 0; i < 7; i++) spawnOrb();
  }
  function botStep(dt) {
    bot.think -= dt;
    if (bot.think <= 0) {
      bot.think = .22 + Math.random() * .25;
      let best = null, bs = 1e9;
      for (const o of S.o) { const d = Math.hypot(o.x - bot.x, o.y - bot.y) - (o.k ? 300 : 0) + Math.random() * 90; if (d < bs) { bs = d; best = o; } }
      if (best) { bot.tx = best.x + (Math.random() - .5) * 40; bot.ty = best.y + (Math.random() - .5) * 40; }
    }
    let tx = bot.tx, ty = bot.ty;
    for (const m of S.m) { const dx = bot.x - m.x, dy = bot.y - m.y, d = Math.hypot(dx, dy); if (d < 180 && d > 1) { tx += dx / d * 220; ty += dy / d * 220; } }
    moveShip(bot, tx, ty, dt, S.st[1] > 0 ? .25 : .6);
  }
  function hostStep(dt) {
    const ms = dt * 1000;
    S.pl[0] = [me.x, me.y, me.a];
    if (S.p2 === "bot") { if (S.ph === "cd" || S.ph === "play") botStep(dt); S.pl[1] = [bot.x, bot.y, bot.a]; }
    else if (S.p2 === "guest") {
      const pr = guestMsg;
      if (pr) {
        S.pl[1] = [num(pr.x, S.pl[1][0], 0, W), num(pr.y, S.pl[1][1], 0, H), num(pr.a, 0, -7, 7)];
        S.n[1] = cleanName(pr.n, "Kumpel");
        const go = num(pr.go, 0, 0, 1e9);
        if (lastP2 !== S.p2) { lastP2 = S.p2; lastGo = go; }
        if (go > lastGo) { lastGo = go; if (S.ph === "lobby" || S.ph === "end") startRound(); }
      }
    }
    if (S.p2 === "bot") S.n[1] = "Bot";
    S.n[0] = myName || "Spieler 1";
    if (S.ph === "cd") { S.cd -= ms; if (S.cd <= 0) { S.cd = 0; S.ph = "play"; } }
    else if (S.ph === "play") {
      S.tl -= ms;
      S.st = S.st.map(v => Math.max(0, v - ms));
      const want = S.tl < 15000 ? 5 : S.tl < 35000 ? 4 : 3;
      while (S.m.length < want) S.m.push(makeMine());
      for (const m of S.m) {
        m.x += m.vx * dt; m.y += m.vy * dt;
        if (m.x < 50 || m.x > W - 50) { m.vx *= -1; m.x = clamp(m.x, 50, W - 50); }
        if (m.y < 50 || m.y > H - 50) { m.vy *= -1; m.y = clamp(m.y, 50, H - 50); }
      }
      for (let i = 0; i < 2; i++) {
        const [px, py] = S.pl[i];
        S.o = S.o.filter(o => { if (Math.hypot(o.x - px, o.y - py) < SHIP_R + ORB_R + (o.k ? 6 : 0)) { S.s[i] += o.k ? 5 : 1; return false; } return true; });
        if (S.st[i] <= 0) for (const m of S.m) if (Math.hypot(m.x - px, m.y - py) < SHIP_R + MINE_R - 6) { S.s[i] = Math.max(0, S.s[i] - 3); S.st[i] = 1400; break; }
      }
      while (S.o.length < 7) spawnOrb();
      if (S.tl <= 0) { S.tl = 0; S.ph = "end"; }
    }
  }
  function packState() {
    const r = Math.round;
    return {
      ph: S.ph, tl: r(S.tl), cd: r(S.cd), s: S.s, rn: S.rn, p2: S.p2, n: S.n, st: S.st.map(r),
      o: S.o.map(o => [o.id, r(o.x), r(o.y), o.k]), m: S.m.map(m => [r(m.x), r(m.y)]),
      pl: S.pl.map(p => [r(p[0]), r(p[1]), r(p[2] * 100)]),
    };
  }
  function unpackState(st) {
    if (!st || typeof st !== "object") return;
    const PH = ["lobby", "cd", "play", "end"];
    S.ph = PH.includes(st.ph) ? st.ph : S.ph;
    S.tl = num(st.tl, S.tl, 0, ROUND); S.cd = num(st.cd, 0, 0, 5000); S.rn = num(st.rn, S.rn, 0, 1e9);
    S.p2 = typeof st.p2 === "string" ? st.p2.slice(0, 64) : "bot";
    if (Array.isArray(st.s)) S.s = [num(st.s[0], 0, 0, 9999), num(st.s[1], 0, 0, 9999)];
    if (Array.isArray(st.st)) S.st = [num(st.st[0], 0, 0, 5000), num(st.st[1], 0, 0, 5000)];
    if (Array.isArray(st.n)) S.n = [cleanName(st.n[0], "Spieler 1"), cleanName(st.n[1], "Kumpel")];
    if (Array.isArray(st.o)) S.o = st.o.slice(0, 20).filter(Array.isArray).map(o => ({ id: num(o[0], 0, 0, 1e12), x: num(o[1], 0, 0, W), y: num(o[2], 0, 0, H), k: o[3] === 1 ? 1 : 0 }));
    if (Array.isArray(st.m)) S.m = st.m.slice(0, 10).filter(Array.isArray).map(m => ({ x: num(m[0], 0, 0, W), y: num(m[1], 0, 0, H) }));
    if (Array.isArray(st.pl)) for (let i = 0; i < 2; i++) { const p = st.pl[i]; if (Array.isArray(p)) S.pl[i] = [num(p[0], 450, 0, W), num(p[1], 750, 0, H), num(p[2], 0, -700, 700) / 100]; }
  }

  // ---------- netzwerk: direkt Handy zu Handy (WebRTC über PeerJS) ----------
  const PREFIX = "orbduell-v1-", ALPHA = "abcdefghjkmnpqrstuvwxyz23456789";
  const code = (location.hash.match(/^#([a-z0-9]{6})$/) || [])[1] || null;
  let net = "off", peer = null, conn = null, guestMsg = null, inviteUrl = "", lastSend = 0, failMsg = "", copiedUntil = 0;
  function becomeHost() {
    isHost = true; mySlot = 0; S.p2 = "bot"; lastP2 = null; S.rn++;
    S.ph = "lobby"; S.tl = ROUND; S.s = [0, 0]; S.st = [0, 0]; S.o = []; S.m = []; resetShip(me, 0); resetShip(bot, 1);
  }
  function wireHostConn(c) {
    if (conn && conn.open) { c.on("open", () => c.close()); return; }
    conn = c;
    c.on("open", () => { if (conn !== c) return; net = "host-on"; failMsg = ""; S.p2 = "guest"; lastP2 = null; guestMsg = null; buzz(30); });
    c.on("data", d => { if (conn === c && d && typeof d === "object" && d.t === "me") guestMsg = d; });
    const drop = () => {
      if (conn !== c) return;
      conn = null; guestMsg = null; net = "host-wait";
      if (S.p2 === "guest") { S.p2 = "bot"; bot.x = S.pl[1][0]; bot.y = S.pl[1][1]; }
    };
    c.on("close", drop); c.on("error", drop);
  }
  function startHost() {
    if (!window.Peer) { net = "fail"; failMsg = failMsg || "Mehrspieler konnte nicht geladen werden. Du spielst gegen den Bot."; return; }
    const id = Array.from(crypto.getRandomValues(new Uint8Array(6)), b => ALPHA[b % ALPHA.length]).join("");
    const pr = peer = new Peer(PREFIX + id, { debug: 0 });
    net = "host-prep";
    pr.on("open", () => { if (peer !== pr) return; inviteUrl = location.origin + location.pathname + "#" + id; $("link").textContent = inviteUrl; if (net === "host-prep") net = "host-wait"; });
    pr.on("connection", c => { if (peer === pr) wireHostConn(c); });
    pr.on("disconnected", () => { if (peer === pr && !pr.destroyed) { try { pr.reconnect(); } catch (e) { } } });
    pr.on("error", e => {
      if (peer !== pr) return;
      if (e && e.type === "unavailable-id") { pr.destroy(); startHost(); }
      else if (net === "host-prep") { net = "fail"; failMsg = "Kein Kontakt zum Spielserver. Du spielst erstmal gegen den Bot. Lade die Seite neu, um es nochmal zu versuchen."; }
    });
  }
  function guestFail(msg) {
    if (isHost) return;
    failMsg = msg; const old = peer; peer = null; conn = null;
    try { old && old.destroy(); } catch (e) { }
    try { history.replaceState(null, "", location.pathname); } catch (e) { }
    becomeHost(); startHost();
  }
  function startGuest() {
    isHost = false; mySlot = 1; net = "guest-wait"; resetShip(me, 1);
    if (!window.Peer) { guestFail("Mehrspieler konnte nicht geladen werden. Du spielst gegen den Bot."); return; }
    const pr = peer = new Peer({ debug: 0 });
    pr.on("open", () => {
      if (peer !== pr) return;
      const c = conn = pr.connect(PREFIX + code, { serialization: "json", reliable: true });
      c.on("open", () => { if (conn === c) { net = "guest-on"; buzz(30); } });
      c.on("data", d => { if (conn === c && d && typeof d === "object" && d.t === "st") unpackState(d.st); });
      c.on("close", () => { if (conn === c) guestFail("Die Verbindung zu deinem Kumpel ist abgebrochen. Du spielst jetzt gegen den Bot."); });
    });
    pr.on("error", e => {
      if (peer !== pr) return;
      guestFail(e && e.type === "peer-unavailable" ? "Dieses Spiel ist nicht mehr offen. Lass dir einen neuen Link schicken." : "Keine Verbindung möglich. Du spielst erstmal gegen den Bot.");
    });
    setTimeout(() => { if (peer === pr && net === "guest-wait") guestFail("Keine Verbindung zustande gekommen. Lass dir einen neuen Link schicken."); }, 20000);
  }
  function netSend() {
    if (!conn || !conn.open || now - lastSend < 1 / 30) return;
    lastSend = now;
    try {
      if (isHost) conn.send({ t: "st", st: packState() });
      else conn.send({ t: "me", x: Math.round(me.x), y: Math.round(me.y), a: Math.round(me.a * 100) / 100, n: myName, go: goCount });
    } catch (e) { }
  }

  // ---------- input ----------
  function toWorld(e) { return [clamp((e.clientX - ox) / sc, 40, W - 40), clamp((e.clientY - oy) / sc, 40, H - 40)]; }
  cv.addEventListener("pointerdown", e => { audio(); try { cv.setPointerCapture(e.pointerId); } catch (x) { } [me.tx, me.ty] = toWorld(e); });
  cv.addEventListener("pointermove", e => { if (e.pointerType === "mouse" || e.buttons || e.pressure > 0) [me.tx, me.ty] = toWorld(e); });
  $("go").addEventListener("click", () => {
    audio();
    try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => { }); } catch (e) { }
    if (isHost) startRound(); else { goCount++; lastSend = -1; netSend(); }
  });
  $("share").addEventListener("click", async () => {
    if (!inviteUrl) return;
    const data = { title: "Orb Duell", text: "Orb Duell gegen mich? Antippen und los:", url: inviteUrl };
    if (navigator.share) { try { await navigator.share(data); return; } catch (e) { if (e && e.name === "AbortError") return; } }
    try { await navigator.clipboard.writeText(inviteUrl); copiedUntil = now + 2; }
    catch (e) { const r = document.createRange(); r.selectNodeContents($("link")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); }
  });

  // ---------- effects ----------
  function burst(x, y, s, n, sp, life = .8) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = sp * (.3 + Math.random() * .7);
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: life * (.5 + Math.random() * .5), max: life, s, r: 10 + Math.random() * 14 });
    }
  }
  function shipPos(i) { return i === mySlot ? me : disp[i]; }
  let prev = { ids: new Map(), s: [0, 0], st: [0, 0], rn: -1, ph: "lobby", cds: 0 };
  function diffFx() {
    const cur = new Map(S.o.map(o => [o.id, o]));
    if (S.rn !== prev.rn) {
      if (!isHost && mySlot === 1) resetShip(me, 1);
      trails[0].length = trails[1].length = 0; born.clear();
      for (const o of S.o) born.set(o.id, now);
    } else {
      for (const [id, o] of prev.ids) if (!cur.has(id)) {
        let who = 0, bd = 1e9;
        for (let i = 0; i < 2; i++) { const p = shipPos(i), d = Math.hypot(p.x - o.x, p.y - o.y); if (d < bd) { bd = d; who = i; } }
        burst(o.x, o.y, o.k ? SPR.gold : pspr(who), o.k ? 46 : 22, o.k ? 620 : 420);
        rings.push({ x: o.x, y: o.y, t: 0, c: o.k ? GOLD : COL[who] });
        if (who === mySlot) { o.k ? sfx.gold() : sfx.orb(); buzz(o.k ? 40 : 12); if (o.k) flash = .35; } else sfx.far();
        born.delete(id);
      }
      for (let i = 0; i < 2; i++) {
        const d = S.s[i] - prev.s[i], p = shipPos(i);
        if (d) texts.push({ x: p.x, y: p.y - 50, t: 0, txt: (d > 0 ? "+" : "") + d, c: d > 0 ? (d >= 5 ? GOLD : COL[i]) : MINE, big: Math.abs(d) >= 3 });
        if (S.st[i] > 0 && prev.st[i] <= 0) {
          burst(p.x, p.y, SPR.mine, 50, 700, 1); rings.push({ x: p.x, y: p.y, t: 0, c: MINE });
          if (i === mySlot) { shake = 22; buzz([60, 40, 60]); sfx.hit(); }
        }
      }
    }
    for (const o of S.o) if (!born.has(o.id)) born.set(o.id, now);
    const cds = S.ph === "cd" ? Math.ceil(S.cd / 1000) : 0;
    if (cds && cds !== prev.cds) sfx.beep();
    if (prev.ph === "cd" && S.ph === "play") { sfx.los(); losT = .9; }
    if (prev.ph === "play" && S.ph === "end") sfx.end();
    prev = { ids: cur, s: S.s.slice(), st: S.st.slice(), rn: S.rn, ph: S.ph, cds };
  }

  // ---------- UI ----------
  const uiCache = {};
  function setText(id, t) { if (uiCache[id] !== t) { uiCache[id] = t; $(id).textContent = t; } }
  function setCls(id, cls, on) { const k = id + "." + cls; if (uiCache[k] !== on) { uiCache[k] = on; $(id).classList.toggle(cls, on); } }
  function ui() {
    const opp = mySlot === 1 ? 0 : 1;
    setText("n0", S.n[0]); setText("n1", S.n[1]);
    $("n0").dataset.you = mySlot === 0; $("n1").dataset.you = mySlot === 1;
    setText("s0", String(S.s[0])); setText("s1", String(S.s[1]));
    const secs = Math.ceil(S.tl / 1000); setText("timer", String(secs));
    setCls("timer", "hot", S.ph === "play" && secs <= 10);
    const showOv = S.ph === "lobby" || S.ph === "end";
    if ($("overlay").hidden === showOv) $("overlay").hidden = !showOv;
    $("endbox").hidden = S.ph !== "end";
    if (S.ph === "end") {
      const a = S.s[0], b = S.s[1];
      let r;
      if (a === b) r = "Unentschieden!";
      else if (mySlot === null) r = (a > b ? S.n[0] : S.n[1]) + " gewinnt";
      else r = (S.s[mySlot] > S.s[opp]) ? "Du gewinnst!" : (S.n[opp] + " gewinnt");
      setText("result", r); setText("finals", `${S.n[0]}  ${a} : ${b}  ${S.n[1]}`);
      setText("kicker", "Runde vorbei");
    } else setText("kicker", "Echtzeit-Duell für zwei Handys");
    let st, cls;
    if (net === "guest-wait") { st = "Verbinde mit deinem Kumpel…"; cls = "wait"; }
    else if (net === "guest-on") { st = `Verbunden mit ${S.n[0]}. Einer von euch drückt Start.`; cls = "on"; }
    else if (net === "host-on") { st = `${S.n[1]} ist verbunden und fliegt gegen dich.`; cls = "on"; }
    else if (failMsg) { st = failMsg; cls = ""; }
    else if (net === "host-wait") { st = "Schick deinem Kumpel den Link. Bis er da ist, spielst du gegen den Bot."; cls = "wait"; }
    else { st = "Einladungslink wird vorbereitet…"; cls = "wait"; }
    setText("statustext", st);
    setCls("status", "on", cls === "on"); setCls("status", "wait", cls === "wait");
    const btn = S.ph === "end" ? "Nochmal" : "Runde starten";
    setText("go", net === "guest-wait" ? "Verbinde…" : btn);
    $("go").disabled = net === "guest-wait";
    const inv = isHost && net === "host-wait" && !!inviteUrl;
    if ($("invite").hidden === inv) $("invite").hidden = !inv;
    setText("share", copiedUntil > now ? "Link kopiert!" : "Kumpel einladen");
  }
  const youStyle = document.createElement("style");
  youStyle.textContent = '.name[data-you="true"]::after{content:"DU";font-size:9px;letter-spacing:.14em;padding:1px 4px;margin-left:6px;border:1px solid currentColor;border-radius:3px;color:var(--ink)}';
  document.head.appendChild(youStyle);

  // ---------- render ----------
  function drawShip(i, p, stunned) {
    const t = trails[i];
    ctx.globalCompositeOperation = "lighter";
    for (let k = 0; k < t.length; k++) { const q = t[k], f = k / t.length; spr(pspr(i), q[0], q[1], 8 + f * 26, f * .35); }
    const flick = stunned ? (Math.sin(now * 40) > 0 ? .25 : 1) : 1;
    spr(pspr(i), p.x, p.y, 100 + Math.sin(now * 6 + i) * 8, .85 * flick);
    const fl = 18 + Math.random() * 14;
    spr(SPR.white, p.x - Math.cos(p.a) * 34, p.y - Math.sin(p.a) * 34, fl, .7 * flick);
    ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = flick;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
    ctx.beginPath(); ctx.moveTo(38, 0); ctx.lineTo(-24, 24); ctx.lineTo(-12, 0); ctx.lineTo(-24, -24); ctx.closePath();
    ctx.fillStyle = "#0d0826"; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = COL[i]; ctx.lineJoin = "round"; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(22, 0); ctx.lineTo(-4, 9); ctx.lineTo(-4, -9); ctx.closePath(); ctx.fillStyle = WHITE; ctx.fill();
    ctx.restore(); ctx.globalAlpha = 1;
    if (i === mySlot && S.ph !== "lobby") {
      ctx.strokeStyle = rgba(COL[i], .35); ctx.lineWidth = 2; ctx.setLineDash([6, 8]);
      ctx.beginPath(); ctx.arc(p.x, p.y, 56, now * 1.5, now * 1.5 + Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    }
  }
  function drawMine(m, k) {
    ctx.globalCompositeOperation = "lighter";
    spr(SPR.mine, m.x, m.y, 70 + Math.sin(now * 8 + k) * 10, .6);
    ctx.globalCompositeOperation = "source-over";
    ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(now * 2 + k);
    ctx.beginPath();
    for (let j = 0; j < 16; j++) { const r = j % 2 ? 18 : 34, a = j / 16 * Math.PI * 2; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
    ctx.closePath(); ctx.fillStyle = "#2a0710"; ctx.fill(); ctx.strokeStyle = MINE; ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fillStyle = Math.sin(now * 10 + k) > 0 ? "#FFE1DC" : MINE; ctx.fill();
    ctx.restore();
  }
  function drawOrb(o) {
    const age = clamp((now - (born.get(o.id) ?? now)) / .35, 0, 1), sIn = 1 - Math.pow(1 - age, 3);
    const pulse = 1 + Math.sin(now * 5 + o.id) * .12;
    ctx.globalCompositeOperation = "lighter";
    if (o.k) {
      spr(SPR.gold, o.x, o.y, 80 * pulse * sIn, .9);
      spr(SPR.white, o.x, o.y, 22 * sIn, 1);
      ctx.globalCompositeOperation = "source-over";
      ctx.strokeStyle = GOLD; ctx.lineWidth = 3; ctx.setLineDash([10, 9]);
      ctx.beginPath(); ctx.arc(o.x, o.y, 34 * sIn, -now * 2, -now * 2 + Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    } else {
      spr(SPR.violet, o.x, o.y, 72 * pulse * sIn, 1);
      spr(SPR.white, o.x, o.y, 18 * sIn, .95);
      ctx.globalCompositeOperation = "source-over";
      ctx.beginPath(); ctx.arc(o.x, o.y, 10 * sIn, 0, Math.PI * 2); ctx.fillStyle = "#E9E1FF"; ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
  }
  function render(dt) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
    if (nebula) ctx.drawImage(nebula, 0, 0, vw, vh);
    const mp = shipPos(mySlot ?? 0), px = (mp.x / W - .5), py = (mp.y / H - .5);
    for (const s of stars) {
      s.y += dt * .012 * s.z; if (s.y > 1) { s.y -= 1; s.x = Math.random(); }
      const x = ((s.x - px * .05 * s.z) % 1 + 1) % 1 * vw, y = ((s.y - py * .05 * s.z) % 1 + 1) % 1 * vh;
      ctx.globalAlpha = .25 + .55 * s.z * (.6 + .4 * Math.sin(now * 2 + s.t));
      ctx.fillStyle = "#DCD4FF"; ctx.fillRect(x, y, s.z * 1.8, s.z * 1.8);
    }
    ctx.globalAlpha = 1;
    let sx = 0, sy = 0; if (shake > .3) { sx = (Math.random() - .5) * shake; sy = (Math.random() - .5) * shake; }
    ctx.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * (ox + sx), dpr * (oy + sy));

    // arena
    ctx.fillStyle = "rgba(10,5,30,.55)"; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(139,107,255,.08)"; ctx.lineWidth = 2; ctx.beginPath();
    for (let x = 100; x < W; x += 100) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (let y = 100; y < H; y += 100) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
    ctx.strokeStyle = "rgba(139,107,255,.22)"; ctx.setLineDash([14, 14]); ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke(); ctx.setLineDash([]);
    [[14, .12], [6, .3], [2.5, .95]].forEach(([w, a]) => { ctx.strokeStyle = `rgba(160,130,255,${a})`; ctx.lineWidth = w; ctx.strokeRect(0, 0, W, H); });
    ctx.strokeStyle = COL[0]; ctx.lineWidth = 6;
    [[0, 0, 1, 1], [W, 0, -1, 1], [0, H, 1, -1], [W, H, -1, -1]].forEach(([x, y, dx, dy], j) => {
      ctx.strokeStyle = j < 2 ? COL[1] : COL[0];
      ctx.beginPath(); ctx.moveTo(x + dx * 70, y); ctx.lineTo(x, y); ctx.lineTo(x, y + dy * 70); ctx.stroke();
    });

    for (const o of S.o) drawOrb(o);
    S.m.forEach((m, k) => drawMine(dispM[k] || m, k));

    for (let i = 0; i < 2; i++) {
      drawShip(i, shipPos(i), S.st[i] > 0);
    }

    ctx.globalCompositeOperation = "lighter";
    rings = rings.filter(r => (r.t += dt) < .5);
    for (const r of rings) { ctx.globalAlpha = 1 - r.t / .5; ctx.strokeStyle = r.c; ctx.lineWidth = 6 * (1 - r.t / .5) + 1; ctx.beginPath(); ctx.arc(r.x, r.y, 20 + r.t * 260, 0, Math.PI * 2); ctx.stroke(); }
    parts = parts.filter(p => (p.life -= dt) > 0);
    const drag = Math.pow(.9, dt * 60);
    for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= drag; p.vy *= drag; const f = p.life / p.max; spr(p.s, p.x, p.y, p.r * f + 2, f); }
    ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;

    texts = texts.filter(t => (t.t += dt) < 1);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (const t of texts) {
      ctx.globalAlpha = 1 - t.t; ctx.font = `700 ${t.big ? 64 : 46}px ${FAM}`;
      ctx.fillStyle = t.c; ctx.fillText(t.txt, t.x, t.y - t.t * 90);
    }
    ctx.globalAlpha = 1;

    // countdown and LOS
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (S.ph === "cd") {
      const n = Math.max(1, Math.ceil(S.cd / 1000)), f = (S.cd / 1000) % 1;
      ctx.globalAlpha = .4 + f * .6; ctx.font = `700 ${Math.round(Math.min(vw, vh) * (.28 + (1 - f) * .08))}px ${FAM}`;
      ctx.fillStyle = WHITE; ctx.fillText(String(n), vw / 2, vh / 2);
    }
    if (losT > 0) {
      ctx.globalAlpha = Math.min(1, losT * 2); ctx.font = `700 ${Math.round(Math.min(vw, vh) * .22)}px ${FAM}`;
      const g = ctx.createLinearGradient(vw * .25, 0, vw * .75, 0); g.addColorStop(0, COL[0]); g.addColorStop(1, COL[1]);
      ctx.fillStyle = g; ctx.fillText("LOS!", vw / 2, vh / 2);
    }
    if (flash > 0) { ctx.globalAlpha = flash * .5; ctx.fillStyle = GOLD; ctx.fillRect(0, 0, vw, vh); }
    ctx.globalAlpha = 1;
  }

  // ---------- main loop ----------
  let last = performance.now();
  function frame(t) {
    const dt = Math.min(.05, (t - last) / 1000); last = t; now += dt;
    if (mySlot !== null) {
      const stunned = S.st[mySlot] > 0, frozen = S.ph === "cd";
      if (!frozen) moveShip(me, me.tx, me.ty, dt, stunned ? .25 : 1);
    }
    if (isHost) hostStep(dt);
    // smooth remote ships
    const k = 1 - Math.exp(-dt * 14);
    for (let i = 0; i < 2; i++) {
      if (i === mySlot) { disp[i].x = me.x; disp[i].y = me.y; disp[i].a = me.a; }
      else {
        const [x, y, a] = S.pl[i], d = disp[i];
        if (Math.hypot(x - d.x, y - d.y) > 400) { d.x = x; d.y = y; } else { d.x += (x - d.x) * k; d.y += (y - d.y) * k; }
        let da = a - d.a; da = Math.atan2(Math.sin(da), Math.cos(da)); d.a += da * k;
      }
      const p = shipPos(i), tr = trails[i];
      tr.push([p.x, p.y]); if (tr.length > 22) tr.shift();
    }
    if (isHost) dispM = S.m.map(m => ({ x: m.x, y: m.y }));
    else {
      if (dispM.length !== S.m.length) dispM = S.m.map(m => ({ x: m.x, y: m.y }));
      else S.m.forEach((m, j) => { dispM[j].x += (m.x - dispM[j].x) * k; dispM[j].y += (m.y - dispM[j].y) * k; });
    }
    diffFx();
    shake *= Math.pow(.86, dt * 60); flash = Math.max(0, flash - dt); losT = Math.max(0, losT - dt);
    netSend();
    ui();
    render(dt);
    requestAnimationFrame(frame);
  }
  resize();
  if (code) startGuest(); else startHost();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
